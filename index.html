<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>سوبرلي</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b8a4b">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--g:#1b8a4b;--bg:#f2f5f3;--t:#1d2b24;--m:#6b7a72;--r:#d93636;--b:#e1e8e4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t);font-size:15px}
.top{position:sticky;top:0;z-index:5}
header{background:var(--g);color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:19px}
header small{opacity:.85}
nav{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--b);scrollbar-width:none}
nav button{flex:0 0 auto;border:0;background:none;padding:7px 14px;font:inherit;font-size:13px;color:var(--m);border-bottom:3px solid transparent}
nav button.on{color:var(--g);border-color:var(--g);font-weight:700}
nav button span{display:block;font-size:19px;text-align:center}
main{padding:12px;max-width:760px;margin:auto;padding-bottom:80px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{margin:0}.stat small{color:var(--m)}.stat b{font-size:19px;display:block;margin-top:4px}
.stat.g b{color:var(--g)}.stat.r b{color:var(--r)}
input,select,textarea{width:100%;padding:10px;border:1px solid #cfd8d3;border-radius:8px;font:inherit;background:#fff;margin:4px 0 8px;color:var(--t)}
label{font-size:13px;color:var(--m)}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;cursor:pointer}
.btn.gray{background:#8a968f}.btn.red{background:var(--r)}.btn.sm{padding:6px 10px;font-size:13px}
.btn.big{width:100%;padding:14px;font-size:17px;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.badge{padding:2px 8px;border-radius:20px;font-size:12px;background:#e6f4ec;color:var(--g);display:inline-block}
.badge.r{background:#fde8e8;color:var(--r)}.badge.o{background:#fff3dc;color:#a86a00}
.modal{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
.box h3{margin:0 0 8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:99;max-width:90%;text-align:center}
.empty{color:var(--m);text-align:center;padding:12px}
.chip{display:block;width:100%;text-align:right;border:1px solid var(--b);background:#f7faf8;border-radius:8px;padding:9px;margin-top:6px;font:inherit}
.qb{border:1px solid var(--b);background:#fff;border-radius:6px;min-width:34px;height:34px;font:inherit;font-size:16px}
.line{padding:8px 0;border-bottom:1px solid var(--b)}.line:last-child{border:0}
.big{font-size:19px}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.login h1{text-align:center;color:var(--g);margin-bottom:4px}
.rc{font-size:14px}.rc table{width:100%;border-collapse:collapse}.rc td,.rc th{padding:4px 2px;border-bottom:1px dashed #bbb;text-align:right}
.ok{background:#e6f4ec}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block}}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>
<script>
/* ================= البيانات ================= */
const KEY='superly_db_v1';
const h=s=>{let x=5381;for(const c of String(s))x=((x<<5)+x+c.charCodeAt(0))|0;return String(x)};
function fresh(){return{products:[],sales:[],purchases:[],suppliers:[],customers:[],expenses:[],payments:[],
 users:[{id:1,name:'المدير',user:'admin',pass:h('1234'),role:'admin'}],seq:{inv:1,id:100},closings:[],settings:{shop:'سوبرلي',openCash:0}}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.products)return Object.assign(fresh(),d)}catch(e){}return fresh()}
let db=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('مشكلة في الحفظ: المساحة ممتلئة؟')}}
const uid=()=>db.seq.id++;
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ================= أدوات ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)));return isNaN(n)?0:n};
const money=n=>(Math.round((n||0)*100)/100).toLocaleString('en-US')+' ج';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const nowStr=()=>{const d=new Date();return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}
const bad=t=>{toast(t);return false};
function copyText(t){try{if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t)}catch(e){}
 const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}
function closeModals(){document.querySelectorAll('.modal').forEach(m=>m.remove())}
function modal(title,body,onok,okText){
 const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class="box"><h3>${title}</h3><div>${body}</div><div class="row" style="margin-top:10px">${onok?`<button class="btn" data-ok style="flex:1">${okText||'حفظ'}</button>`:''}<button class="btn gray" data-no style="flex:1">${onok?'إلغاء':'إغلاق'}</button></div></div>`;
 document.body.appendChild(m);
 m.querySelector('[data-no]').onclick=()=>m.remove();
 if(onok)m.querySelector('[data-ok]').onclick=()=>{if(onok(m)!==false)m.remove()};
 return m;
}
const val=(m,n)=>m.querySelector('[name="'+n+'"]').value.trim();
const fld=(l,n,v,t,x)=>`<label>${l}</label><input name="${n}" type="${t||'text'}" value="${esc(v==null?'':v)}" ${t==='number'?'inputmode="decimal" step="any"':''} ${x||''}>`;
const sel=(l,n,opts,v)=>`<label>${l}</label><select name="${n}">${opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
const sb=(l,v,c)=>`<div class="card stat ${c||''}"><small>${l}</small><b>${v}</b></div>`;

/* ================= الدخول والصلاحيات ================= */
const TABS=[
 {id:'dash',t:'الرئيسية',i:'🏠',roles:['admin']},
 {id:'pos',t:'الكاشير',i:'🛒',roles:['admin','cashier']},
 {id:'inv',t:'الفواتير',i:'🧾',roles:['admin','cashier']},
 {id:'prod',t:'المنتجات',i:'📦',roles:['admin']},
 {id:'cust',t:'العملاء',i:'👥',roles:['admin','cashier']},
 {id:'sup',t:'الموردين',i:'🚚',roles:['admin']},
 {id:'exp',t:'المصاريف',i:'💸',roles:['admin']},
 {id:'rep',t:'التقارير',i:'📊',roles:['admin']},
 {id:'set',t:'الإعدادات',i:'⚙️',roles:['admin']}
];
const V={};
let me=null,tab='dash',pq='',cart=[],pdisc=0,pm='cash',pcust='',ppaid='',rp='month',idt=null;
try{const id=+localStorage.getItem('superly_me');me=db.users.find(u=>u.id===id)||null}catch(e){}
const isAdmin=()=>me&&me.role==='admin';
function login(){
 if(!$('#lu')||!$('#lp'))return;
 const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value;
 const x=db.users.find(x=>x.user===u&&x.pass===h(p));
 if(!x)return toast('اسم المستخدم أو كلمة السر غلط');
 me=x;localStorage.setItem('superly_me',x.id);tab=x.role==='admin'?'dash':'pos';render();
}
function logout(){me=null;localStorage.removeItem('superly_me');cart=[];render()}
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){
 try{renderMain()}catch(e){
  $('#app').innerHTML='<div class="login"><div class="card"><b>حصل خطأ في عرض الشاشة</b><p style="color:var(--m);font-size:13px">'+esc(e.message)+'</p><button class="btn big" onclick="location.reload()">إعادة تحميل</button></div></div>';
 }
}
function renderMain(){
 const app=$('#app');
 if(!me){
  app.innerHTML=`<div class="login"><h1>🛒 ${esc(db.settings.shop)}</h1><p style="text-align:center;color:var(--m)">سجّل دخولك</p>
  <div class="card"><label>اسم المستخدم</label><input id="lu" autocomplete="off" autocapitalize="none"><label>كلمة السر</label><input id="lp" type="password" onkeydown="if(event.key==='Enter')login()">
  <button class="btn big" onclick="login()">دخول</button>
  <p style="color:var(--m);font-size:12px;margin-bottom:0">أول مرة؟ المستخدم: <b>admin</b> وكلمة السر: <b>1234</b> (غيّرها من الإعدادات)</p></div></div>`;
  return;
 }
 const tabs=TABS.filter(t=>t.roles.includes(me.role));
 if(!tabs.some(t=>t.id===tab))tab=tabs[0].id;
 app.innerHTML=`<div class="top"><header><div><b>🛒 ${esc(db.settings.shop)}</b><br><small>${esc(me.name)}</small></div><button class="btn sm gray" onclick="logout()">خروج</button></header>
 <nav>${tabs.map(t=>`<button class="${t.id===tab?'on':''}" onclick="go('${t.id}')"><span>${t.i}</span>${t.t}</button>`).join('')}</nav></div><main id="main"></main>`;
 V[tab]();
}

/* ================= الإحصائيات والتنبيهات ================= */
function stats(from,to){
 const S=db.sales.filter(x=>{const d=x.date.slice(0,10);return d>=from&&d<=to});
 let sales=0,cogs=0;const items={};
 S.forEach(s=>{sales+=s.total-s.refund;s.items.forEach(i=>{const q=i.qty-i.ret;cogs+=q*i.cost;items[i.name]=(items[i.name]||0)+q})});
 const exp=db.expenses.filter(x=>x.date>=from&&x.date<=to).reduce((a,x)=>a+x.amt,0);
 return{n:S.length,sales,cogs,exp,gross:sales-cogs,profit:sales-cogs-exp,
  top:Object.entries(items).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,5)};
}
// رصيد الخزنة = رصيد افتتاحي + مقبوضات − مدفوعات − مرتجعات نقدية + فروق قفل اليوم
// (المرتجع النقدي بيتحسب من الفواتير نفسها؛ سجل type='r' في payments للعرض بس)
function cashBalance(){
 const inSales=db.sales.reduce((a,s)=>a+(s.paid||0),0);
 const inPayments=db.payments.filter(p=>p.type==='c').reduce((a,p)=>a+p.amt,0);
 const outPurchases=db.purchases.reduce((a,p)=>a+(p.paid||0),0);
 const outPayments=db.payments.filter(p=>p.type==='s').reduce((a,p)=>a+p.amt,0);
 const outExpenses=db.expenses.reduce((a,e)=>a+e.amt,0);
 const outRefunds=db.sales.reduce((a,s)=>a+Math.max((s.refund||0)-(s.refDed||0),0),0);
 const open=db.settings.openCash||0;
 const adj=(db.closings||[]).reduce((a,c)=>a+c.diff,0);
 return Math.round((open+inSales+inPayments-outPurchases-outPayments-outExpenses-outRefunds+adj)*100)/100;
}
function lowList(){return db.products.filter(p=>p.qty<=p.min).sort((a,b)=>a.qty-b.qty)}
function expList(){const lim=addDays(today(),30);return db.products.filter(p=>p.exp&&p.exp<=lim&&p.qty>0).sort((a,b)=>a.exp<b.exp?-1:1)}
function alertsHtml(){
 const t=today(),low=lowList(),ex=expList();
 return `<div class="card"><b>⚠️ أصناف قربت تخلص (${low.length})</b>`+
  (low.length?low.slice(0,20).map(p=>`<div class="row sp line"><span>${esc(p.name)}</span><span class="badge r">${p.qty}</span></div>`).join(''):'<div class="empty">كله تمام ✅</div>')+`</div>
 <div class="card"><b>⏳ صلاحية قربت تخلص (${ex.length})</b>`+
  (ex.length?ex.slice(0,20).map(p=>`<div class="row sp line"><span>${esc(p.name)} <small>(${p.qty})</small></span><span class="badge ${p.exp<t?'r':'o'}">${p.exp<t?'منتهي ':''}${p.exp}</span></div>`).join(''):'<div class="empty">مفيش منتجات قربت تنتهي ✅</div>')+`</div>`;
}

/* ================= الرئيسية ================= */
V.dash=()=>{
 const t=today(),s=stats(t,t);
 $('#main').innerHTML=`<div class="grid">${sb('مبيعات اليوم',money(s.sales),'g')}${sb('عدد الفواتير',s.n)}${sb('ربح اليوم',money(s.profit),s.profit<0?'r':'g')}${sb('مصاريف اليوم',money(s.exp))}</div>
 <div class="card ok"><small>💵 رصيد الخزنة (النقدية)</small><br><b class="big" style="color:var(--g)">${money(cashBalance())}</b><div class="row" style="margin-top:8px"><button class="btn sm" onclick="closeDayForm()">🔒 قفل اليوم</button><button class="btn sm gray" onclick="closingsList()">السجل</button></div></div>
 <button class="btn big" style="margin-bottom:10px" onclick="go('pos')">🛒 بيع جديد</button>${alertsHtml()}`;
};

/* ================= المنتجات والمخزون ================= */
V.prod=()=>{
 $('#main').innerHTML=`<div class="row"><input id="pqi" placeholder="بحث بالاسم أو الباركود أو القسم" value="${esc(pq)}" oninput="pq=this.value;prodList()" style="flex:1;margin:0"><button class="btn" onclick="productForm()">+ منتج</button></div><div id="pl" style="margin-top:10px"></div>`;
 prodList();
};
function prodList(){
 const q=pq.trim().toLowerCase(),t=today(),lim=addDays(t,30);
 const L=db.products.filter(p=>!q||(p.name+' '+p.barcode+' '+p.cat).toLowerCase().includes(q));
 $('#pl').innerHTML=L.length?L.map(p=>`<div class="card"><div class="row sp"><b>${esc(p.name)}</b><span class="badge ${p.qty<=p.min?'r':''}">المخزون: ${p.qty}</span></div>
 <div class="row" style="margin:6px 0;color:var(--m);font-size:13px">${p.cat?`<span class="badge">${esc(p.cat)}</span>`:''}<span>سعر البيع: <b>${money(p.price)}</b></span><span>الشراء: ${money(p.cost)}</span>${p.barcode?`<span>🔖 ${esc(p.barcode)}</span>`:''}${p.exp?`<span class="badge ${p.exp<t?'r':p.exp<=lim?'o':''}">صلاحية ${p.exp}</span>`:''}</div>
 <div class="row"><button class="btn sm" onclick="productForm(${p.id})">تعديل</button><button class="btn sm red" onclick="delProduct(${p.id})">حذف</button></div></div>`).join(''):'<div class="empty">مفيش منتجات. اضغط "+ منتج"</div>';
}
function productForm(id){
 const p=db.products.find(x=>x.id===id)||{name:'',barcode:'',cat:'',cost:'',price:'',qty:'',min:5,exp:''};
 const mm=modal(id?'تعديل منتج':'منتج جديد',
  fld('اسم المنتج','name',p.name)+`<div class="row" style="align-items:flex-end"><div style="flex:1">${fld('الباركود (اختياري)','barcode',p.barcode)}</div><button class="btn" data-scan type="button" style="margin-bottom:8px">📷</button></div>`+fld('القسم (مثلاً: ألبان)','cat',p.cat)+
  `<div class="row"><div style="flex:1">${fld('سعر الشراء','cost',p.cost,'number')}</div><div style="flex:1">${fld('سعر البيع','price',p.price,'number')}</div></div>
  <div class="row"><div style="flex:1">${fld('الكمية','qty',p.qty,'number')}</div><div style="flex:1">${fld('حد التنبيه','min',p.min,'number')}</div></div>`+
  fld('تاريخ الصلاحية (اختياري)','exp',p.exp,'date'),
 m=>{
  const name=val(m,'name');if(!name)return bad('اكتب اسم المنتج');
  const bc=val(m,'barcode');
  if(bc&&db.products.some(x=>x.barcode===bc&&x.id!==id))return bad('الباركود ده مستخدم في منتج تاني');
  const price=num(val(m,'price'));if(price<=0)return bad('اكتب سعر البيع');
  const o={name,barcode:bc,cat:val(m,'cat'),cost:num(val(m,'cost')),price,qty:num(val(m,'qty')),min:num(val(m,'min')),exp:val(m,'exp')};
  if(id)Object.assign(p,o);else db.products.push(Object.assign({id:uid()},o));
  save();V.prod();
 });
 mm.querySelector('[data-scan]').onclick=()=>scanBarcode(code=>{mm.querySelector('[name=barcode]').value=code;toast('تم قراءة الباركود: '+code)},false);
}
function delProduct(id){
 if(!confirm('حذف المنتج ده؟ (الفواتير القديمة مش هتتأثر)'))return;
 db.products=db.products.filter(x=>x.id!==id);
 cart=cart.filter(i=>i.id!==id);
 save();prodList();toast('تم الحذف');
}

/* ================= الكاشير ================= */
V.pos=()=>{
 $('#main').innerHTML=`<div class="card"><div class="row"><input id="ps" placeholder="🔍 اكتب الباركود أو اسم الصنف" autocomplete="off" onkeydown="if(event.key==='Enter')posEnter()" oninput="posSearch()" style="flex:1;margin:0"><button class="btn" onclick="scanBarcode(posScan,true)">📷</button></div><div id="pr"></div></div><div class="card" id="cartbox"></div>`;
 cartRender();
};
function posSearch(){
 const q=$('#ps').value.trim().toLowerCase(),box=$('#pr');
 if(!q){box.innerHTML='';return}
 const L=db.products.filter(p=>(p.name+' '+p.barcode).toLowerCase().includes(q)).slice(0,8);
 box.innerHTML=L.length?L.map(p=>`<button class="chip" onclick="addCart(${p.id})">${esc(p.name)} — <b>${money(p.price)}</b> <small>(متاح ${p.qty})</small></button>`).join(''):'<div class="empty">مفيش نتيجة</div>';
}
function posEnter(){
 const q=$('#ps').value.trim().toLowerCase();if(!q)return;
 const ex=db.products.find(p=>p.barcode&&p.barcode.toLowerCase()===q);
 if(ex)return addCart(ex.id);
 const L=db.products.filter(p=>(p.name+' '+p.barcode).toLowerCase().includes(q));
 if(L.length>1)return toast('فيه '+L.length+' نتيجة — اختار من القائمة تحت');
 if(L.length===1)return addCart(L[0].id);
 // 🔧 تنبيه لو مفيش نتيجة
 toast('مفيش صنف بالاسم ده');
}
function addCart(id,nf){
 const p=db.products.find(x=>x.id===id);if(!p)return;
 const it=cart.find(x=>x.id===id),want=(it?it.qty:0)+1;
 if(want>p.qty)return toast('الكمية المتاحة '+p.qty+' بس');
 if(it)it.qty=want;else cart.push({id:p.id,name:p.name,price:p.price,cost:p.cost,qty:1});
 const s=$('#ps');s.value='';$('#pr').innerHTML='';cartRender();if(!nf)s.focus();return true;
}
function chg(k,d){
 const it=cart[k],p=db.products.find(x=>x.id===it.id),q=it.qty+d;
 if(q<=0){cart.splice(k,1)}else if(p&&q>p.qty)return toast('الكمية المتاحة '+p.qty+' بس');else it.qty=q;
 cartRender();
}
function setQty(k){
 const it=cart[k],p=db.products.find(x=>x.id===it.id);
 const q=num(prompt('الكمية',it.qty));if(q<=0)return;
 if(p&&q>p.qty)return toast('الكمية المتاحة '+p.qty+' بس');
 it.qty=q;cartRender();
}
function calc(){const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);const disc=Math.min(Math.max(pdisc,0),sub);return{sub,disc,total:sub-disc}}
function cartRender(){
 const box=$('#cartbox');if(!box)return;
 if(!cart.length){box.innerHTML='<div class="empty">السلة فاضية 🛒<br>ابحث عن صنف وضيفه</div>';return}
 box.innerHTML=cart.map((i,k)=>`<div class="line"><div class="row sp"><b>${esc(i.name)}</b><button class="qb" onclick="chg(${k},-${i.qty})" style="color:var(--r)">✕</button></div>
 <div class="row sp"><div class="row"><button class="qb" onclick="chg(${k},-1)">−</button><button class="qb" onclick="setQty(${k})" style="min-width:48px">${i.qty}</button><button class="qb" onclick="chg(${k},1)">+</button><small>× ${money(i.price)}</small></div><b>${money(i.price*i.qty)}</b></div></div>`).join('')+
 `<div class="row" style="margin-top:8px"><div style="flex:1"><label>خصم (جنيه)</label><input type="number" inputmode="decimal" value="${pdisc||''}" oninput="pdisc=num(this.value);totRender()"></div>
 <div style="flex:1"><label>طريقة الدفع</label><select onchange="pm=this.value;cartRender()"><option value="cash" ${pm==='cash'?'selected':''}>كاش</option><option value="credit" ${pm==='credit'?'selected':''}>آجل</option></select></div></div>`+
 (pm==='credit'?`<label>العميل</label><select onchange="pcust=this.value"><option value="">— اختار العميل —</option>${db.customers.map(c=>`<option value="${c.id}" ${String(c.id)===String(pcust)?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`:'')+
 `<label>${pm==='cash'?'المبلغ المستلم (اختياري، لحساب الباقي)':'المدفوع الآن (اختياري)'}</label><input type="number" inputmode="decimal" value="${ppaid}" oninput="ppaid=this.value;totRender()">
 <div id="tot"></div><button class="btn big" onclick="checkout()">✅ إتمام البيع</button>`;
 totRender();
}
function totRender(){
 const e=$('#tot');if(!e)return;const c=calc();
 let t=`<div class="row sp"><span>المجموع</span><b>${money(c.sub)}</b></div>`;
 if(c.disc>0)t+=`<div class="row sp"><span>الخصم</span><b>− ${money(c.disc)}</b></div>`;
 t+=`<div class="row sp big" style="margin:6px 0"><span>الإجمالي</span><b style="color:var(--g)">${money(c.total)}</b></div>`;
 if(pm==='cash'&&ppaid!==''&&num(ppaid)>=c.total)t+=`<div class="row sp"><span>الباقي للعميل</span><b>${money(num(ppaid)-c.total)}</b></div>`;
 if(pm==='credit')t+=`<div class="row sp"><span>هيتسجل آجل</span><b>${money(c.total-Math.min(num(ppaid),c.total))}</b></div>`;
 e.innerHTML=t;
}
function checkout(){
 if(!cart.length)return toast('السلة فاضية');
 const c=calc();let paid,cust=null;
 if(pm==='cash'){const r=ppaid===''?c.total:num(ppaid);if(r<c.total)return toast('المبلغ المستلم أقل من الإجمالي');paid=c.total}
 else{cust=db.customers.find(x=>String(x.id)===String(pcust));if(!cust)return toast('اختار العميل للبيع الآجل');paid=Math.min(num(ppaid),c.total)}
 for(const i of cart){const p=db.products.find(x=>x.id===i.id);if(!p||p.qty<i.qty)return toast('الكمية مش كافية: '+i.name)}
 const sale={id:uid(),no:db.seq.inv++,date:nowStr(),items:cart.map(i=>{const p=db.products.find(x=>x.id===i.id);return{id:i.id,name:i.name,price:i.price,cost:p?p.cost:i.cost,qty:i.qty,ret:0}}),
  sub:c.sub,disc:c.disc,total:c.total,method:pm,paid,cust:cust?cust.id:null,custName:cust?cust.name:'',user:me.name,refund:0};
 cart.forEach(i=>{db.products.find(x=>x.id===i.id).qty-=i.qty});
 if(cust)cust.balance=(cust.balance||0)+c.total-paid;
 const change=pm==='cash'&&ppaid!==''?num(ppaid)-c.total:0;
 db.sales.push(sale);save();
 cart=[];pdisc=0;ppaid='';pcust='';
 V.pos();showInvoice(sale.id,change);
}

/* ================= الفواتير والمرتجعات ================= */
V.inv=()=>{
 if(idt===null)idt=today();
 $('#main').innerHTML=`<div class="row"><input type="date" id="idt" value="${idt}" onchange="idt=this.value;invList()" style="flex:1;margin:0"><button class="btn gray sm" onclick="idt='';V.inv()">كل الفواتير</button></div><div id="il" style="margin-top:10px"></div>`;
 invList();
};
function invList(){
 const all=db.sales.filter(s=>!idt||s.date.slice(0,10)===idt).sort((a,b)=>b.id-a.id);
 const L=all.slice(0,100);
 const tot=L.reduce((a,s)=>a+s.total-s.refund,0);
 const note=all.length>100?`<div class="empty" style="font-size:12px">عرض 100 من أصل ${all.length} فاتورة — اختر تاريخًا لعرض الأقدم</div>`:'';
 $('#il').innerHTML=(L.length?`<div class="card ok row sp"><span>${all.length} فاتورة</span><b>${money(tot)}</b></div>`+L.map(s=>`<div class="card" onclick="showInvoice(${s.id})"><div class="row sp"><b>فاتورة #${s.no}</b><b>${money(s.total)}</b></div>
 <div class="row sp" style="color:var(--m);font-size:13px"><span>${s.date.replace('T',' ')} • ${esc(s.user)}</span><span>${s.method==='credit'?`<span class="badge o">آجل — ${esc(s.custName)}</span>`:'<span class="badge">كاش</span>'}${s.refund>0?' <span class="badge r">مرتجع</span>':''}</span></div></div>`).join('')+note:'<div class="empty">مفيش فواتير</div>');
}
function receiptHtml(s){
 return `<div class="rc"><h3 style="text-align:center;margin:0">${esc(db.settings.shop)}</h3><p style="text-align:center;margin:2px 0 8px">فاتورة #${s.no}<br>${s.date.replace('T',' ')} — ${esc(s.user)}${s.custName?'<br>العميل: '+esc(s.custName):''}</p>
 <table><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${s.items.map(i=>`<tr><td>${esc(i.name)}${i.ret?` <small>(مرتجع ${i.ret})</small>`:''}</td><td>${i.qty}</td><td>${i.price}</td><td>${Math.round(i.qty*i.price*100)/100}</td></tr>`).join('')}</table>
 <p style="margin:8px 0 0">المجموع: ${money(s.sub)}${s.disc?`<br>الخصم: ${money(s.disc)}`:''}<br><b>الإجمالي: ${money(s.total)}</b><br>الدفع: ${s.method==='credit'?'آجل':'كاش'}${s.method==='credit'?` — مدفوع ${money(s.paid)} / متبقي ${money(s.total-s.paid)}`:''}${s.refund?`<br>المرتجعات: ${money(s.refund)}`:''}</p></div>`;
}
function showInvoice(id,change){
 const s=db.sales.find(x=>x.id===id);if(!s)return;
 closeModals();
 modal('🧾 تفاصيل الفاتورة',`<div id="invb">${receiptHtml(s)}</div>${change>0?`<div class="card ok" style="margin-top:8px">الباقي للعميل: <b>${money(change)}</b></div>`:''}
 <div class="row" style="margin:10px 0"><button class="btn sm" onclick="printInv(${id})">🖨 طباعة</button><button class="btn sm" onclick="shareInv(${id})">📤 مشاركة / نسخ</button></div>
 ${isAdmin()?`<b>مرتجع</b>${s.items.map((i,k)=>`<div class="row sp line"><span>${esc(i.name)} <small>(متبقي ${i.qty-i.ret})</small></span>${i.qty-i.ret>0?`<button class="btn sm red" onclick="returnForm(${id},${k})">مرتجع</button>`:'<span class="badge">اتسترجع</span>'}</div>`).join('')}`:''}`);
}
function printInv(id){const s=db.sales.find(x=>x.id===id);$('#print').innerHTML=receiptHtml(s);window.print()}
function shareInv(id){
 const s=db.sales.find(x=>x.id===id);
 const t=`${db.settings.shop}\nفاتورة #${s.no} — ${s.date.replace('T',' ')}\n`+s.items.map(i=>`${i.name} × ${i.qty} = ${Math.round(i.qty*i.price*100)/100}`).join('\n')+`\nالإجمالي: ${money(s.total)}`;
 if(navigator.share)navigator.share({text:t}).catch(()=>{});else{copyText(t);toast('تم نسخ الفاتورة')}
}
function returnForm(id,k){
 const s=db.sales.find(x=>x.id===id),it=s.items[k],max=it.qty-it.ret;
 const cust=s.cust?db.customers.find(x=>x.id===s.cust):null;
 const hasDebt=cust&&(cust.balance||0)>0;
 const note=`<p style="font-size:13px;color:var(--m)">${
   s.method==='cash'?'فاتورة كاش — ارجّع للعميل نقدًا يدويًا.':
   hasDebt?'فاتورة آجل والعميل عليه دين — المبلغ هيتخصم من دينه.':
   'فاتورة آجل والعميل مش عليه دين — ارجّع له نقدًا يدويًا (مش هيتخصم من الرصيد).'
 }</p>`;
 modal('مرتجع: '+esc(it.name),note+fld('الكمية المرتجعة (الحد الأقصى '+max+')','q',max,'number'),m=>{
  const q=num(val(m,'q'));if(q<=0||q>max)return bad('كمية غلط');
  const v=q*it.price*(s.sub?s.total/s.sub:1);
  it.ret+=q;s.refund+=v;
  const p=db.products.find(x=>x.id===it.id);if(p)p.qty+=q;
  let cashRefund=v;
  if(cust&&hasDebt){
    const deduct=Math.min(v,cust.balance||0);
    cust.balance-=deduct;s.refDed=(s.refDed||0)+deduct;
    cashRefund=v-deduct;
    if(deduct<v)toast('اتخصم '+money(deduct)+' من الدين — ارجّع الباقي '+money(cashRefund)+' نقدًا');
    else toast('اتخصم من حساب العميل '+money(v));
  }else{
    toast('رجّع للعميل '+money(v)+' نقدًا يدويًا');
  }
  // 🔧 تسجيل المرتجع الكاش في سجل المدفوعات (type='r')
  if(cashRefund>0){
    db.payments.push({id:uid(),date:nowStr(),type:'r',who:id,amt:cashRefund});
  }
  save();
  setTimeout(()=>{showInvoice(id);if(tab==='inv')invList()},0);
 },'تأكيد المرتجع');
}

/* ================= العملاء والآجل ================= */
V.cust=()=>{
 const tot=db.customers.reduce((a,c)=>a+Math.max(c.balance||0,0),0);
 $('#main').innerHTML=`<div class="row sp" style="margin-bottom:10px"><div class="card ok" style="margin:0;flex:1"><small>إجمالي الديون عند العملاء</small><br><b>${money(tot)}</b></div><button class="btn" onclick="custForm()">+ عميل</button></div>`+
 (db.customers.length?db.customers.map(c=>{const b=c.balance||0;return `<div class="card"><div class="row sp"><b>${esc(c.name)}</b><span class="badge ${b>0?'r':''}">${b>0?'عليه '+money(b):b<0?'له '+money(-b):'مفيش دين'}</span></div>
 ${c.phone?`<div style="color:var(--m);font-size:13px">📞 ${esc(c.phone)}</div>`:''}<div class="row" style="margin-top:6px">${b>0?`<button class="btn sm" onclick="collectForm(${c.id})">💰 تحصيل</button>`:''}<button class="btn sm gray" onclick="statement(${c.id})">كشف حساب</button>${isAdmin()?`<button class="btn sm red" onclick="delCust(${c.id})">حذف</button>`:''}</div></div>`}).join(''):'<div class="empty">مفيش عملاء</div>');
};
function custForm(){
 modal('عميل جديد',fld('الاسم','name')+fld('الموبايل (اختياري)','phone'),m=>{
  const name=val(m,'name');if(!name)return bad('اكتب الاسم');
  db.customers.push({id:uid(),name,phone:val(m,'phone'),balance:0});save();V.cust();
 });
}
function delCust(id){const c=db.customers.find(x=>x.id===id);if((c.balance||0)!==0)return toast('مينفعش تحذف عميل عليه رصيد');if(!confirm('حذف العميل؟'))return;db.customers=db.customers.filter(x=>x.id!==id);save();V.cust()}
function collectForm(id){
 const c=db.customers.find(x=>x.id===id);
 modal('تحصيل من '+esc(c.name),`<p>المطلوب: <b>${money(c.balance)}</b></p>`+fld('المبلغ المدفوع','amt',c.balance,'number'),m=>{
  const a=num(val(m,'amt'));if(a<=0||a>c.balance)return bad('مبلغ غلط');
  c.balance-=a;db.payments.push({id:uid(),date:nowStr(),type:'c',who:id,amt:a});save();V.cust();toast('تم التحصيل');
 },'تحصيل');
}
function statement(id){
 const c=db.customers.find(x=>x.id===id),E=[];
 db.sales.filter(s=>s.cust===id).forEach(s=>{
   E.push({d:s.date,t:'فاتورة #'+s.no,v:s.total-s.paid,id:s.id});
   const rd=s.refDed||0;
   if(rd)E.push({d:s.date,t:'مرتجع فاتورة #'+s.no,v:-rd,id:s.id});
 });
 db.payments.filter(p=>p.type==='c'&&p.who===id).forEach(p=>E.push({d:p.date,t:'دفعة',v:-p.amt,id:p.id}));
 E.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.id||0)-(b.id||0));
 const sum=E.reduce((a,x)=>a+x.v,0);
 const diff=Math.round(((c.balance||0)-sum)*100)/100;
 const warn=Math.abs(diff)>0.01?`<div class="card" style="background:#fff3dc;color:#a86a00;font-size:13px;margin-top:8px">⚠️ فرق بين مجموع الحركات (${money(sum)}) والرصيد المسجل (${money(c.balance||0)}). راجع الإعدادات لإعادة الحساب.</div>`:'';
 modal('كشف حساب: '+esc(c.name),(E.length?E.map(e=>`<div class="row sp line"><span>${e.t}<br><small style="color:var(--m)">${e.d.replace('T',' ')}</small></span><b style="color:${e.v>0?'var(--r)':'var(--g)'}">${e.v>0?'+':''}${money(e.v)}</b></div>`).join(''):'<div class="empty">مفيش حركات</div>')+`<p class="big">مجموع الحركات: <b>${money(sum)}</b><br>الرصيد المسجل: <b>${money(c.balance||0)}</b></p>`+warn);
}

 (db.suppliers.length?db.suppliers.map(s=>{const b=s.balance||0;return `<div class="card"><div class="row sp"><b>${esc(s.name)}</b><span class="badge ${b>0?'o':''}">${b>0?'ليه عندك '+money(b):b<0?'ليك عنده '+money(-b):'متصفّي'}</span></div>
 ${s.phone?`<div style="color:var(--m);font-size:13px">📞 ${esc(s.phone)}</div>`:''}<div class="row" style="margin-top:6px"><button class="btn sm" onclick="purchaseForm(${s.id})">📥 شراء بضاعة</button>${b>0?`<button class="btn sm" onclick="payForm(${s.id})">💵 دفع</button>`:''}<button class="btn sm gray" onclick="purHistory(${s.id})">المشتريات</button><button class="btn sm red" onclick="delSup(${s.id})">حذف</button></div></div>`}).join(''):'<div class="empty">مفيش موردين</div>');

function supForm(){
 modal('مورد جديد',fld('اسم المورد / الشركة','name')+fld('الموبايل (اختياري)','phone'),m=>{
  const name=val(m,'name');if(!name)return bad('اكتب الاسم');
  db.suppliers.push({id:uid(),name,phone:val(m,'phone'),balance:0});save();V.sup();
 });

function delSup(id){const s=db.suppliers.find(x=>x.id===id);if((s.balance||0)!==0)return toast('مينفعش تحذف مورد فيه رصيد');if(!confirm('حذف المورد؟'))return;db.suppliers=db.suppliers.filter(x=>x.id!==id);save();V.sup()}
function payForm(id){

 modal('دفع للمورد '+esc(s.name),`<p>المستحق: <b>${money(s.balance)}</b></p>`+fld('المبلغ','amt',s.balance,'number'),m=>{

function purchaseForm(sid){
 const s=db.suppliers.find(x=>x.id===sid);
 if(!db.products.length)return toast('ضيف منتجات الأول من تبويب المنتجات');
 const items=[];
 const m=modal('شراء من '+esc(s.name),
  sel('المنتج','prod',db.products.map(p=>[p.id,p.name]))+
  `<div class="row"><div style="flex:1">${fld('الكمية','qty','','number')}</div><div style="flex:1">${fld('سعر الشراء','cost','','number')}</div></div>`+
  fld('تاريخ الصلاحية (اختياري)','iexp','','date')+
  `<button class="btn sm" data-add>+ إضافة للقائمة</button><div id="pit" style="margin:8px 0"></div>`+fld('المدفوع للمورد الآن','paid',0,'number'),
 m=>{
  if(!items.length)return bad('ضيف صنف واحد على الأقل');
  const total=items.reduce((a,i)=>a+i.qty*i.cost,0),paid=Math.min(num(val(m,'paid')),total);
  items.forEach(i=>{const p=db.products.find(x=>x.id===i.id);if(p){p.qty+=i.qty;p.cost=i.cost;if(i.exp)p.exp=i.exp}});
  db.purchases.push({id:uid(),date:nowStr(),sup:sid,items:items.map(i=>({id:i.id,name:i.name,qty:i.qty,cost:i.cost})),total,paid});
  s.balance=(s.balance||0)+total-paid;save();V.sup();toast('تم تسجيل الشراء وزيادة المخزون');
 },'تسجيل الشراء');
 const prodSel=m.querySelector('[name=prod]');
 const fill=()=>{const p=db.products.find(x=>String(x.id)===prodSel.value);m.querySelector('[name=cost]').value=p&&p.cost?p.cost:''};
 prodSel.onchange=fill;fill();
 const draw=()=>{
  const tot=items.reduce((a,i)=>a+i.qty*i.cost,0);
  m.querySelector('#pit').innerHTML=items.map((i,k)=>`<div class="row sp line"><span>${esc(i.name)} × ${i.qty} @ ${i.cost}</span><button class="btn red sm" data-rm="${k}">✕</button></div>`).join('')+(items.length?`<b>الإجمالي: ${money(tot)}</b>`:'');
  m.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.rm,1);draw()});
 };
 m.querySelector('[data-add]').onclick=()=>{
  const p=db.products.find(x=>String(x.id)===prodSel.value),q=num(val(m,'qty')),c=num(val(m,'cost'));
  if(!p||q<=0||c<=0)return toast('اكتب الكمية وسعر الشراء');
  items.push({id:p.id,name:p.name,qty:q,cost:c,exp:val(m,'iexp')});
  m.querySelector('[name=qty]').value='';m.querySelector('[name=iexp]').value='';draw();
 };
}
function purHistory(id){
 const L=db.purchases.filter(p=>p.sup===id).sort((a,b)=>b.id-a.id);
 modal('مشتريات المورد',L.length?L.map(p=>`<div class="line"><div class="row sp"><b>${p.date.replace('T',' ')}</b><b>${money(p.total)}</b></div><small style="color:var(--m)">${p.items.map(i=>esc(i.name)+' ×'+i.qty).join('، ')}<br>مدفوع: ${money(p.paid)}</small></div>`).join(''):'<div class="empty">مفيش مشتريات</div>');
}

/* ================= التقارير ================= */
V.rep=()=>{
 const t=today(),from={day:t,week:addDays(t,-6),month:t.slice(0,8)+'01',all:'0000-00-00'}[rp],s=stats(from,t);
 const stock=db.products.reduce((a,p)=>a+p.qty*p.cost,0);
 const cd=db.customers.reduce((a,c)=>a+Math.max(c.balance||0,0),0),sd=db.suppliers.reduce((a,x)=>a+Math.max(x.balance||0,0),0);
 $('#main').innerHTML=`<select onchange="rp=this.value;V.rep()"><option value="day" ${rp==='day'?'selected':''}>النهارده</option><option value="week" ${rp==='week'?'selected':''}>آخر 7 أيام</option><option value="month" ${rp==='month'?'selected':''}>الشهر ده</option><option value="all" ${rp==='all'?'selected':''}>الكل</option></select>
 <div class="grid">${sb('صافي المبيعات',money(s.sales),'g')}${sb('عدد الفواتير',s.n)}${sb('تكلفة البضاعة',money(s.cogs))}${sb('مجمل الربح',money(s.gross))}${sb('المصاريف',money(s.exp))}${sb('صافي الربح',money(s.profit),s.profit<0?'r':'g')}</div>
 <div class="grid">${sb('💵 رصيد الخزنة',money(cashBalance()),'g')}${sb('قيمة المخزون',money(stock))}${sb('ديون العملاء',money(cd),'r')}${sb('مستحق للموردين',money(sd))}</div>
 <div class="card"><b>🏆 أكتر الأصناف مبيعًا</b>${s.top.length?s.top.map((x,i)=>`<div class="row sp line"><span>${i+1}. ${esc(x[0])}</span><b>${x[1]}</b></div>`).join(''):'<div class="empty">مفيش مبيعات</div>'}</div>
 <div class="grid">${sb('عدد المنتجات',db.products.length)}</div>
 <div style="height:10px"></div>${alertsHtml()}`;
};

/* ================= الإعدادات والمستخدمين والنسخ الاحتياطي ================= */
V.set=()=>{
 $('#main').innerHTML=`<div class="card"><b>🏪 اسم المحل</b>${fld('الاسم','shop',db.settings.shop)}<button class="btn sm" onclick="saveShop()">حفظ</button></div>
 <div class="card"><div class="row sp"><b>👤 المستخدمين</b><button class="btn sm" onclick="userForm()">+ مستخدم</button></div>${db.users.map(u=>`<div class="row sp line"><span>${esc(u.name)} <small>(${esc(u.user)})</small> <span class="badge">${u.role==='admin'?'مدير':'كاشير'}</span></span><span class="row"><button class="btn sm gray" onclick="passForm(${u.id})">كلمة السر</button>${u.id!==me.id?`<button class="btn sm red" onclick="delUser(${u.id})">حذف</button>`:''}</span></div>`).join('')}</div>
 <div class="card"><b>💾 نسخ احتياطي</b><p style="color:var(--m);font-size:13px">البيانات متخزنة على الموبايل ده بس. اعمل نسخة كل يوم.</p><div class="row"><button class="btn sm" onclick="exportDb()">تنزيل ملف</button><button class="btn sm" onclick="copyDb()">نسخ البيانات</button><button class="btn sm gray" onclick="importForm()">استرجاع</button></div></div>
 <div class="card"><b>💵 الخزنة</b><p style="color:var(--m);font-size:13px">الرصيد الافتتاحي = اللي كان في الدرج قبل ما تبدأ تسجّل في سوبرلي.</p>${fld('الرصيد الافتتاحي','open',db.settings.openCash||0,'number')}<div class="row"><button class="btn sm" onclick="saveOpenCash()">حفظ</button><button class="btn sm gray" onclick="closingsList()">سجل قفل اليوم</button></div></div>
 <div class="card"><b>📲 تثبيت التطبيق</b><p style="color:var(--m);font-size:13px">يتثبّت على شاشة الموبايل ويشتغل من غير نت. بيحتاج رابط https (شوف الشرح).</p><button class="btn sm" onclick="installApp()">تثبيت على الموبايل</button></div>
 <div class="card"><b>🔧 صيانة البيانات</b><p style="color:var(--m);font-size:13px">إعادة حساب أرصدة العملاء والموردين من الحركات (لو لاحظت فروقات).</p><button class="btn sm gray" onclick="recalcAll()">إعادة حساب الأرصدة</button></div>
 <div class="card"><b>🧪 تجربة</b><p style="color:var(--m);font-size:13px">ضيف منتجات تجريبية عشان تجرب الكاشير.</p><button class="btn sm gray" onclick="loadDemo()">إضافة منتجات تجريبية</button> <button class="btn sm red" onclick="resetAll()">مسح كل البيانات</button></div>`;
};
function saveShop(){const v=$('[name=shop]').value.trim();if(!v)return toast('اكتب الاسم');db.settings.shop=v;save();render();toast('تم الحفظ')}
function userForm(){
 modal('مستخدم جديد',fld('الاسم','name')+fld('اسم الدخول (إنجليزي)','user','','text','autocapitalize="none"')+fld('كلمة السر','pass','','password')+sel('الصلاحية','role',[['cashier','كاشير (بيع وفواتير وعملاء)'],['admin','مدير (كل حاجة)']]),m=>{
  const name=val(m,'name'),user=val(m,'user').toLowerCase(),pass=m.querySelector('[name=pass]').value;
  if(!name||!user||pass.length<4)return bad('كمّل البيانات (كلمة السر 4 حروف على الأقل)');
  if(db.users.some(u=>u.user===user))return bad('اسم الدخول مستخدم');
  db.users.push({id:uid(),name,user,pass:h(pass),role:val(m,'role')});save();V.set();
 });
}
function passForm(id){
 const u=db.users.find(x=>x.id===id);
 modal('كلمة سر جديدة: '+esc(u.name),fld('كلمة السر الجديدة','pass','','password'),m=>{
  const p=m.querySelector('[name=pass]').value;if(p.length<4)return bad('4 حروف على الأقل');
  u.pass=h(p);save();toast('تم تغيير كلمة السر');
 });
}
function delUser(id){
 const u=db.users.find(x=>x.id===id);
 if(u.role==='admin'&&db.users.filter(x=>x.role==='admin').length<2)return toast('لازم يفضل مدير واحد على الأقل');
 if(!confirm('حذف '+u.name+'؟'))return;db.users=db.users.filter(x=>x.id!==id);save();V.set();
}
function exportDb(){
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));
 a.download='superly-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('جاري التنزيل…');
}
function copyDb(){copyText(JSON.stringify(db));toast('تم نسخ البيانات — الصقها في ملاحظة أو ابعتها لنفسك')}
function importForm(){
 modal('استرجاع نسخة',`<label>اختار ملف النسخة</label><input type="file" name="file" accept=".json,application/json"><label>أو الصق البيانات هنا</label><textarea name="txt" rows="4"></textarea><p style="color:var(--r);font-size:13px">⚠️ هتتبدل كل البيانات الحالية.</p>`,m=>{
  const f=m.querySelector('[name=file]').files[0],txt=m.querySelector('[name=txt]').value.trim();
  if(f)f.text().then(applyImport);else if(txt)applyImport(txt);else return bad('اختار ملف أو الصق بيانات');
 },'استرجاع');
}
function applyImport(t){
 try{
  const d=JSON.parse(t);if(!Array.isArray(d.products)||!Array.isArray(d.users))throw 0;
  if(!confirm('هتتبدل كل البيانات الحالية. متأكد؟'))return;
  db=Object.assign(fresh(),d);
  const allRows=[db.products,db.sales,db.purchases,db.customers,db.suppliers,db.expenses,db.payments,db.closings||[]].flat();
  const maxId=allRows.reduce((m,x)=>Math.max(m,x&&x.id?x.id:0),0);
  db.seq=db.seq||{};
  db.seq.id=Math.max(db.seq.id||0,maxId+1);
  const maxInv=db.sales.reduce((m,s)=>Math.max(m,s.no||0),0);
  db.seq.inv=Math.max(db.seq.inv||0,maxInv+1);
  save();me=db.users.find(u=>me&&u.id===me.id)||null;render();toast('تم الاسترجاع ✅');
 }catch(e){toast('الملف مش نسخة سوبرلي صحيحة')}
}
function recalcAll(){
 if(!confirm('هيتم إعادة حساب أرصدة العملاء والموردين من الفواتير والمدفوعات. متأكد؟'))return;
 db.customers.forEach(c=>{
   let bal=0;
   db.sales.filter(s=>s.cust===c.id).forEach(s=>{bal+=s.total-(s.refDed||0)-(s.paid||0)});
   db.payments.filter(p=>p.type==='c'&&p.who===c.id).forEach(p=>{bal-=p.amt});
   c.balance=Math.round(bal*100)/100;
 });
 db.suppliers.forEach(s=>{
   let bal=0;
   db.purchases.filter(p=>p.sup===s.id).forEach(p=>{bal+=p.total-(p.paid||0)});
   db.payments.filter(p=>p.type==='s'&&p.who===s.id).forEach(p=>{bal-=p.amt});
   s.balance=Math.round(bal*100)/100;
 });
 save();toast('تمت إعادة الحساب ✅');render();
}
function loadDemo(){
 [['لبن 1 لتر','6221','ألبان',28,34,40,10],['خبز توست','6222','مخبوزات',20,25,25,8],['أرز 1 كجم','6223','بقالة',32,38,60,15],['سكر 1 كجم','6224','بقالة',30,36,50,15],['زيت 1 لتر','6225','بقالة',60,70,30,10],['شاي 100 جم','6226','مشروبات',35,42,3,5]]
 .forEach(a=>{if(!db.products.some(p=>p.barcode===a[1]))db.products.push({id:uid(),name:a[0],barcode:a[1],cat:a[2],cost:a[3],price:a[4],qty:a[5],min:a[6],exp:a[0].startsWith('لبن')?addDays(today(),10):''})});
 save();toast('تم إضافة منتجات تجريبية');
}
function resetAll(){
 if(!confirm('هتمسح كل البيانات نهائيًا!'))return;if(!confirm('متأكد؟ مفيش رجعة.'))return;
 db=fresh();save();logout();
}

/* ================= الخزنة وقفل اليوم ================= */
function closeDayForm(){
 const exp=cashBalance(),last=(db.closings||[]).slice(-1)[0];
 const m=modal('🔒 قفل اليوم',`<p>المفروض في الدرج: <b>${money(exp)}</b>${last?`<br><small style="color:var(--m)">آخر قفل: ${last.date.replace('T',' ')} — ${esc(last.user)}</small>`:''}</p>`+
  fld('المبلغ الفعلي في الدرج (عدّه)','cnt','','number')+`<div id="cdf" style="margin:4px 0 8px"></div>`+fld('ملاحظة (اختياري)','note'),m=>{
  const raw=val(m,'cnt');if(raw==='')return bad('اكتب المبلغ الفعلي');
  const cnt=num(raw),diff=Math.round((cnt-exp)*100)/100;
  db.closings.push({id:uid(),date:nowStr(),user:me.name,expected:exp,counted:cnt,diff,note:val(m,'note')});
  save();render();
  toast(diff===0?'القفل تمام ✅ مفيش فرق':diff<0?'عجز '+money(-diff):'زيادة '+money(diff));
 },'تأكيد القفل');
 m.querySelector('[name=cnt]').oninput=e=>{
  const v=e.target.value,box=m.querySelector('#cdf');
  if(v===''){box.innerHTML='';return}
  const d=Math.round((num(v)-exp)*100)/100;
  box.innerHTML=d===0?'<span class="badge">مظبوط ✅</span>':`<span class="badge ${d<0?'r':'o'}">${d<0?'عجز':'زيادة'} ${money(Math.abs(d))}</span>`;
 };
}
function closingsList(){
 const L=(db.closings||[]).slice().reverse();
 modal('📜 سجل قفل اليوم',L.length?L.map(c=>`<div class="line"><div class="row sp"><b>${c.date.replace('T',' ')}</b><span class="badge ${c.diff<0?'r':c.diff>0?'o':''}">${c.diff===0?'مظبوط':c.diff<0?'عجز '+money(-c.diff):'زيادة '+money(c.diff)}</span></div><small style="color:var(--m)">${esc(c.user)} • المفروض ${money(c.expected)} • الفعلي ${money(c.counted)}${c.note?' • '+esc(c.note):''}</small></div>`).join(''):'<div class="empty">لسه مفيش قفل</div>');
}
function saveOpenCash(){db.settings.openCash=num($('[name=open]').value);save();render();toast('تم حفظ الرصيد الافتتاحي')}

/* ================= مسح الباركود بالكاميرا ================= */
function loadZX(){return new Promise((ok,no)=>{
 if(window.ZXing)return ok();
 const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
 s.onload=ok;s.onerror=()=>no(new Error('load'));document.head.appendChild(s);
})}
// continuous=true: يفضل شغال ويستدعي onCode(code,setStatus) لكل باركود؛ false: يقرا باركود واحد ويقفل
function scanBarcode(onCode,continuous){
 const m=modal('📷 مسح الباركود','<video id="scv" playsinline muted autoplay style="width:100%;border-radius:10px;background:#000;max-height:50vh"></video><div id="scs" class="empty">جاري تشغيل الكاميرا…</div>');
 const st=t=>{const e=m.querySelector('#scs');if(e)e.textContent=t};
 let stream=null,stopped=false,timer=null,reader=null,last='',lastT=0;
 const stop=()=>{if(stopped)return;stopped=true;clearInterval(timer);try{reader&&reader.reset()}catch(e){}try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}};
 m.querySelector('[data-no]').onclick=()=>{stop();m.remove()};
 const gone=setInterval(()=>{if(!document.body.contains(m)){stop();clearInterval(gone)}},500);
 const got=code=>{
  const now=Date.now();if(code===last&&now-lastT<1800)return;last=code;lastT=now;
  try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  if(continuous)onCode(code,st);else{stop();m.remove();onCode(code)}
 };
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){st('الكاميرا مش متاحة هنا. افتح التطبيق من Chrome على رابط https.');return}
 if('BarcodeDetector' in window){
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(s=>{
   if(stopped){s.getTracks().forEach(t=>t.stop());return}
   stream=s;const v=m.querySelector('#scv');v.srcObject=s;v.play().catch(()=>{});
   let det;try{det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39']})}catch(e){det=new BarcodeDetector()}
   st('وجّه الكاميرا ناحية الباركود');
   timer=setInterval(()=>{if(v.readyState<2)return;det.detect(v).then(r=>{if(r.length)got(r[0].rawValue)}).catch(()=>{})},300);
  }).catch(()=>st('مفيش إذن للكاميرا. اسمح بالكاميرا من إعدادات المتصفح.'));
 }else{
  st('جاري تحميل قارئ الباركود (محتاج نت أول مرة)…');
  loadZX().then(()=>{
   if(stopped)return;
   reader=new ZXing.BrowserMultiFormatReader();
   st('وجّه الكاميرا ناحية الباركود');
   reader.decodeFromVideoDevice(undefined,m.querySelector('#scv'),(res)=>{if(res)got(res.getText())});
  }).catch(()=>st('مقدرناش نشغّل المسح هنا. اكتب الباركود يدوي.'));
 }
}
function posScan(code,st){
 const p=db.products.find(x=>x.barcode&&x.barcode===code);
 if(!p){st('الباركود '+code+' مش متسجل');return}
 const ok=addCart(p.id,true);
 const n=cart.reduce((a,i)=>a+i.qty,0);
 st(ok?'✅ '+p.name+' — في السلة '+n+' قطعة':'⚠️ '+p.name+' — الكمية مش كافية');
}

/* ================= تثبيت التطبيق ================= */
let dip=null;
if(window.addEventListener)window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e});
function installApp(){
 if(dip){dip.prompt();dip=null;return}
 toast('افتح التطبيق من Chrome على رابط https، وبعدين: ⋮ ← تثبيت التطبيق');
}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol||''))navigator.serviceWorker.register('sw.js').catch(()=>{});

render();
